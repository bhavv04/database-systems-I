{% extends "base.html" %}

{% block title %}View Tables{% endblock %}

{% block content %}

<div class="row mt-4">
    <div class="col-md-10 mx-auto">
        <h1 class="text-center mb-4">Database Tables</h1>
        
        <div class="card">
            <div class="card-header bg-info text-white">
                <h3>Available Tables</h3>
            </div>
            <div class="card-body">
                <div class="list-group">
                    {% for table in tables %}
                        <a href="/view-table/{{ table }}" class="list-group-item list-group-item-action">
                            <i class="bi bi-table"></i> {{ table|upper }}
                        </a>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <a href="/" class="btn btn-secondary">← Back to Home</a>
        </div>
    </div>
</div>

{% endblock %}
